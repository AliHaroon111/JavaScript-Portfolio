<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Showcase Mastery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="products">
    <div class="panel product1" data-id="1">
      <p class="price">From $999</p>
      <p class="name">Laptop Pro</p>
      <button class="buy">Buy Now</button>
    </div>

    <div class="panel product2" data-id="2">
      <p class="price">From $199</p>
      <p class="name">Earbuds</p>
      <button class="buy">Buy Now</button>
    </div>

    <div class="panel product3" data-id="3">
      <p class="price">From $49</p>
      <p class="name">Smart Watch</p>
      <button class="buy">Buy Now</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
