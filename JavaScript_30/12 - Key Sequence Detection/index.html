<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Key Detection</title>
    <script type="text/javascript" src="./cornify.js"></script>
    <link rel="icon" href="https://fav.farm/🔥" />
  </head>
  <body>
    <script>
      // array for key pressed
      const pressed = [];
      const secretCode = 'haroon'
      
      window.addEventListener('keyup',(e)=>{
        console.log(e.key)
        pressed.push(e.key)
        /**
      *  THE MOVING WINDOW LOGIC: 
      * Maintains a sliding window matching the exact length of our secret code (6 characters).
      * Negative start index (-7) targets the oldest elements forcing an upstream trim, 
      * while the delete count pushes out exactly 1 overflow character per keypress.
      */
        pressed.splice(-secretCode.length - 1, pressed.length - secretCode.length); //this deleting from last 6 mean it delete the - 7th and so on and only keep the 6 digit

        // Check if our array matches the secret code string
        if(pressed.join('').includes(secretCode)){
          console.log('DING DING! Secret Code Activated!');
          cornify_add(); // A built-in fun function from Wes that drops random unicorns onto the screen
        }

        console.log(pressed); // Watch the array update in real-time in your console
      });
    </script>
  </body>
</html>
