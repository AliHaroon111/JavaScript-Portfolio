<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML5 Canvas</title>
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body>
<canvas id="draw" width="800" height="800"></canvas>
<script>
const canvas = document.querySelector('#draw'); //canvas is just a block of actual pixels YOU need to then draw
const ctx = canvas.getContext('2d');
// resize canvas fit to window
canvas.width = window.innerWidth
canvaseight = window.innerHeight
ctx.strokeStyle='#BADA55'
ctx.lineJoin = 'round'
ctx.lineCap = 'round'

let isDrawing = false;  // we toggle it true when mouse clicked
let lastX = 0
let lastY = 0

function draw(e){
 if (!isDrawing) return; //stop the fn from runing when there no mousedown
  console.log(e)
  // Draw a path using context
  ctx.beginPath();
  // start from
  ctx.moveTo(lastX,lastY);
  //go to
  ctx.lineTo(e.offsetX,e.offsetY);
  ctx.stroke(); //we not see anything on page until we call stroke
  [lastX,lastY] = [e.offsetX,e.offsetY]
}

canvas.addEventListener('mousemove',draw);
canvas.addEventListener('mousedown', (e)=> {
  isDrawing = true;
  [lastX,lastY] = [e.offsetX,e.offsetY];

});

canvas.addEventListener('mouseup', ()=> isDrawing = false);
canvas.addEventListener('mouseout', ()=> isDrawing = false);
</script>

<style>
  html, body {
    margin: 0;
  }
</style>

</body>
</html>
